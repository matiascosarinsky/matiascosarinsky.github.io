name: Update publications

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 1 * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install updater
        run: python -m pip install scholarly pypdf pymupdf

      - name: Fetch publication metadata and collect new titles
        id: update_with_summary
        shell: bash
        run: |
          set -o pipefail
          python scripts/update_publications.py | tee update.log
          {
            echo 'new_publications<<EOF'
            sed -n 's/^NEW_PUBLICATION: //p' update.log
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications.json assets/publication-links.json assets/figures
          git diff --cached --quiet || git commit -m "Update publications"
          git push

      - name: Email new-publication notification
        if: steps.update_with_summary.outputs.new_publications != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "New publication added to your website"
          to: matias.cosarinsky@gmail.com
          from: Website updater <${{ secrets.SMTP_USERNAME }}>
          body: |
            New publications were added:

            ${{ steps.update_with_summary.outputs.new_publications }}

            Add any Project Page, Code, Dataset, or Demo links in:
            assets/publication-links.json
